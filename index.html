<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍊 直到大地变成一颗酸橙 — 梗图生成器</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
    background: linear-gradient(160deg, #FFF8E1 0%, #F3FFE3 55%, #E6F7E0 100%);
    min-height: 100vh; display: flex; flex-direction: column; color: #2E3A24;
  }
  header#toolbar {
    display: flex; align-items: center; gap: 10px; padding: 12px 20px; flex-wrap: wrap;
    background: rgba(255,255,255,0.92); backdrop-filter: blur(6px);
    border-bottom: 2px solid #FFD24A; box-shadow: 0 2px 12px rgba(120,90,0,0.08);
    position: sticky; top: 0; z-index: 20;
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-right: 6px; }
  .brand .logo { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid #FFB800; background: #FFF3D6; }
  .brand .t {
    font-weight: 900; font-size: 20px; letter-spacing: 1px; white-space: nowrap;
    background: linear-gradient(90deg, #FF9F1C, #7DDF64); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .brand .sub { font-size: 10px; color: #8A9B7A; letter-spacing: 2px; display: block; margin-top: 1px; }
  button {
    background: #fff; color: #4A5C38; border: 2px solid #DCE8CE; padding: 8px 16px; border-radius: 999px;
    cursor: pointer; font-size: 13px; font-family: inherit; font-weight: 600; transition: all 0.15s;
  }
  button:hover { border-color: #FFB800; color: #E08A00; transform: translateY(-1px); }
  button.primary {
    background: linear-gradient(135deg, #FFB800, #FF9F1C); color: #fff; border: none;
    box-shadow: 0 3px 10px rgba(255,159,28,0.35);
  }
  button.primary:hover { filter: brightness(1.06); color: #fff; }
  button.danger:hover { border-color: #ff6b6b; color: #ff6b6b; }
  #status { margin-left: auto; font-size: 12px; color: #7A8C66; }
  main#main { flex: 1; display: flex; min-height: 0; }
  aside#side {
    width: 302px; min-width: 302px; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px;
    background: rgba(255,255,255,0.55);
  }
  .panel { background: #fff; border: 1.5px solid #EAF0DE; border-radius: 16px; padding: 12px; box-shadow: 0 4px 14px rgba(60,80,30,0.06); }
  .panel h3 { font-size: 13px; font-weight: 800; color: #E08A00; margin-bottom: 10px; letter-spacing: 0.5px; }
  .panel input[type="text"] {
    width: 100%; padding: 9px 12px; border-radius: 10px; border: 2px solid #EAF0DE;
    background: #FFFDF5; color: #2E3A24; font-size: 16px; font-weight: 800; font-family: inherit; outline: none;
  }
  .panel input[type="text"]:focus { border-color: #FFB800; }

  /* ── 文字面板 · 匹配 9-1 蓝色漫画风格 ── */
  #textPanel {
    background: linear-gradient(172deg, #F4F9FF 0%, #EDF5FD 40%, #E0ECF8 100%);
    border: 2.5px solid #1368C0;
    border-radius: 18px;
    box-shadow: 0 4px 18px rgba(19,104,192,0.13), inset 0 1px 0 rgba(255,255,255,0.8);
  }
  #textPanel h3 {
    color: #1368C0;
    font-size: 14px;
    font-weight: 900;
    letter-spacing: 1.5px;
    margin-bottom: 10px;
    text-shadow: 0 1px 0 rgba(255,255,255,0.6);
  }
  #textPanel input[type="text"] {
    border: 2px solid #B8D4F0;
    background: #fff;
    color: #0B3D66;
    border-radius: 11px;
    font-weight: 800;
    padding: 10px 13px;
  }
  #textPanel input[type="text"]:focus {
    border-color: #1368C0;
    box-shadow: 0 0 0 3px rgba(19,104,192,0.12);
  }
  #textPanel .presets button.on {
    border-color: #1368C0;
    background: #E0F0FF;
    color: #1368C0;
    font-weight: 700;
  }
  #textPanel .field {
    color: #2A5580;
  }
  #textPanel .field input[type="color"] {
    border-color: #C8DDF2;
  }
  #textPanel .field input[type="range"] {
    accent-color: #1368C0;
  }
  #textPanel .field .val {
    color: #1368C0;
    font-weight: 700;
  }
  #textPanel .row button.primary {
    background: linear-gradient(135deg, #1368C0, #1A7FE0);
    box-shadow: 0 3px 12px rgba(19,104,192,0.35);
  }
  #textPanel .row button.primary:hover {
    background: linear-gradient(135deg, #1A7FE0, #2190F0);
    color: #fff;
  }
  #textPanel .presets button {
    border-color: #C8DDF2;
    color: #3A6A90;
  }
  #textPanel .presets button:hover {
    border-color: #1368C0;
    color: #1368C0;
    background: #F0F7FF;
  }
  #textPanel .row button {
    border-color: #C8DDF2;
  }
  .field { display: flex; align-items: center; gap: 8px; margin-top: 9px; font-size: 12px; color: #5A6C48; }
  .field label { flex: 0 0 auto; width: 92px; }
  .field input[type="color"] { width: 40px; height: 26px; border: 2px solid #EAF0DE; border-radius: 8px; background: none; cursor: pointer; padding: 2px; }
  .field input[type="range"] { flex: 1; accent-color: #FF9F1C; }
  .field .val { width: 34px; text-align: right; color: #8A9B7A; }
  .presets { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .presets button { font-size: 12px; padding: 4px 10px; border-width: 1.5px; }
  .presets button.on { border-color: #FFB800; background: #FFF3D6; color: #E08A00; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 4px; }
  .cell { background: #FFFDF7; border: 1.5px solid #EAF0DE; border-radius: 12px; padding: 5px; text-align: center; cursor: pointer; transition: all 0.15s; }
  .cell:hover { border-color: #FFB800; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(255,159,28,0.15); }
  .cell img { width: 100%; border-radius: 8px; display: block; background: #F6F9EF; }
  .cell .nm { font-size: 11px; color: #5A6C48; margin-top: 4px; display: block; }
  .cell .ops { display: flex; gap: 4px; margin-top: 4px; }
  .cell .ops button { flex: 1; font-size: 11px; padding: 3px 0; border-width: 1.5px; }
  #layerList { list-style: none; }
  #layerList li {
    display: flex; align-items: center; gap: 6px; padding: 7px 9px; border-radius: 10px;
    border: 1.5px solid transparent; font-size: 12px; cursor: pointer; margin-bottom: 4px; background: #FFFDF7;
  }
  #layerList li:hover { background: #FFF9E8; }
  #layerList li.sel { border-color: #FFB800; background: #FFF3D6; }
  #layerList li .tag { font-size: 10px; background: #EAF2DC; color: #4A6B2E; padding: 1px 6px; border-radius: 6px; }
  #layerList li .del { margin-left: auto; color: #E08A00; border: none; background: none; cursor: pointer; font-size: 14px; padding: 0 4px; }
  #layerList li .del:hover { color: #ff4d4d; }
  .row { display: flex; gap: 6px; margin-top: 10px; }
  .row button { flex: 1; font-size: 12px; }
  #stage { flex: 1; overflow: auto; position: relative; padding: 0 16px 16px; }
  #hint { font-size: 12px; color: #8A9B7A; padding: 10px 4px 4px; }
  #canvasBox {
    position: relative; margin: 10px auto; background-image:
      repeating-conic-gradient(#F4F7EC 0% 25%, #EDF2E2 0% 50%);
    background-size: 22px 22px; border: 2px solid #DCE8CE; border-radius: 10px;
    box-shadow: 0 8px 24px rgba(60,80,30,0.12); overflow: hidden;
  }
  #bg { position: absolute; inset: 0; }
  #bg img { width: 100%; height: 100%; display: block; }
  #layers { position: absolute; inset: 0; }
  .ly { position: absolute; transform: translate(-50%, -50%); cursor: grab; user-select: none; -webkit-user-select: none; }
  .ly.sel::after {
    content: ""; position: absolute; inset: -6px; border: 2px dashed #FF9F1C; border-radius: 8px; pointer-events: none;
  }
  .ly .txt {
    font-weight: 900; font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
    white-space: nowrap; line-height: 1.25; display: block;
  }

  /* ── 9-1 蓝色对话气泡 ── */
  .ly .bubble {
    background: #fff;
    border: 2.5px solid #1368C0;
    border-radius: 11px;
    padding: 0.3em 0.55em;
    position: relative;
    display: inline-block;
    box-shadow: 2px 3px 0 rgba(19,104,192,0.13);
  }
  /* 气泡尾巴外三角(蓝色) */
  .ly .bubble::before {
    content: "";
    position: absolute;
    bottom: -8px;
    left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 7px solid transparent;
    border-right: 7px solid transparent;
    border-top: 8px solid #1368C0;
  }
  /* 气泡尾巴内三角(白色覆盖) */
  .ly .bubble::after {
    content: "";
    position: absolute;
    bottom: -4px;
    left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 4px solid transparent;
    border-right: 4px solid transparent;
    border-top: 5px solid #fff;
  }
  /* ── AI 风格化 ── */
  #btnAiGen {
    background: linear-gradient(135deg, #7C3AED, #A855F7);
    color: #fff; border: none;
    box-shadow: 0 3px 12px rgba(124,58,237,0.35);
    position: relative;
    overflow: hidden;
  }
  #btnAiGen:hover { filter: brightness(1.08); color: #fff; }
  #btnAiGen.loading { pointer-events: none; opacity: 0.7; }
  #btnAiGen.loading::after {
    content: ""; position: absolute; bottom: 0; left: 0; height: 3px;
    background: rgba(255,255,255,0.6);
    animation: aiPulse 1.2s ease-in-out infinite;
    border-radius: 2px;
  }
  @keyframes aiPulse {
    0% { width: 0%; left: 0%; }
    50% { width: 60%; left: 20%; }
    100% { width: 0%; left: 100%; }
  }
  #aiSettingsToggle {
    font-size: 11px; color: #8A9B7A; cursor: pointer; user-select: none;
    display: inline-block; margin-top: 6px; text-decoration: underline dashed;
  }
  #aiSettingsToggle:hover { color: #7C3AED; }
  #aiSettings {
    display: none; margin-top: 8px; padding: 10px;
    background: #FAFBFC; border: 1.5px solid #E8E0F0; border-radius: 10px;
  }
  #aiSettings.show { display: block; }
  #aiSettings label { font-size: 11px; color: #5A4A6A; display: block; margin-top: 6px; }
  #aiSettings label:first-child { margin-top: 0; }
  #aiSettings input[type="text"], #aiSettings input[type="password"] {
    width: 100%; padding: 6px 10px; border-radius: 8px; border: 1.5px solid #E0D8EC;
    font-size: 12px; font-family: inherit; outline: none; margin-top: 2px;
    background: #fff; color: #3A2A4A;
  }
  #aiSettings input:focus { border-color: #A855F7; }
  #aiSettings .hint { font-size: 10px; color: #9A8AAA; margin-top: 4px; line-height: 1.4; }
  #aiStatus { font-size: 11px; min-height: 16px; margin-top: 2px; }
  #aiStatus.ok { color: #4CAF50; }
  #aiStatus.err { color: #E53935; }

  #dropHint {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #A9B896; font-size: 15px; pointer-events: none; text-align: center; padding: 20px; line-height: 1.8;
  }
  #dropHint b { color: #E08A00; }
  #overlay {
    position: fixed; inset: 0; background: rgba(255,248,225,0.82); backdrop-filter: blur(4px);
    display: none; align-items: center; justify-content: center; z-index: 99;
  }
  #overlay.show { display: flex; }
  #overlay .box {
    background: #fff; border: 2px solid #FFD24A; border-radius: 18px; padding: 28px 40px;
    text-align: center; box-shadow: 0 10px 40px rgba(120,90,0,0.18); min-width: 300px;
  }
  #overlay .box .em { font-size: 34px; margin-bottom: 10px; }
  #bar { width: 260px; height: 12px; background: #F0F5E6; border-radius: 8px; overflow: hidden; margin: 14px auto 6px; }
  #bar > div { height: 100%; width: 0%; background: linear-gradient(90deg, #FFD24A, #7DDF64); border-radius: 8px; transition: width 0.15s; }
  #ovNote { font-size: 11px; color: #A9B896; margin-top: 4px; }
</style>
</head>
<body>
<header id="toolbar">
  <div class="brand">
    <img class="logo" id="brandLogo" alt="" src="">
    <div><span class="t">直到大地变成一颗酸橙</span><span class="sub">LIME MEME STUDIO</span></div>
  </div>
  <button id="btnPhoto" class="primary">📷 上传照片</button>
  <button id="btnAuto">✨ 自动找位置</button>
  <button id="btnPng">⬇ 导出 PNG</button>
  <button id="btnGif">⬇ 导出 GIF(动图)</button>
  <input type="file" id="fileInput" accept="image/*" hidden>
  <span id="status"></span>
</header>
<main id="main">
  <aside id="side">
    <section class="panel" id="textPanel">
      <h3>✏️ 标题文字</h3>
      <input type="text" id="textInput" value="直到大地变成一颗酸橙">
      <div class="presets" id="presetRow"></div>
      <div class="field"><label>文字颜色</label><input type="color" id="txtColor" value="#0B1F33"><span class="val"></span></div>
      <div class="field"><label>描边颜色</label><input type="color" id="strokeColor" value="#1368C0"><span class="val"></span></div>
      <div class="field"><label>描边粗细 %</label><input type="range" id="strokeWidth" min="2" max="16" value="7" step="0.5"><span class="val" id="vStrokeWidth"></span></div>
      <div class="field"><label>字号(宽%)</label><input type="range" id="fontSize" min="3" max="22" value="9" step="0.5"><span class="val" id="vFontSize"></span></div>
      <div class="row">
        <button id="btnAddText" class="primary">➕ 添加</button>
        <button id="btnAiGen">🤖 AI 风格化</button>
      </div>
      <span id="aiSettingsToggle">⚙ 设置 API</span>
      <div id="aiSettings">
        <label>Anthropic API Key</label>
        <input type="password" id="aiApiKey" placeholder="sk-ant-...">
        <label>代理地址（可选，解决 CORS）</label>
        <input type="text" id="aiProxy" placeholder="留空直连，或填 https://your-proxy.com/v1">
        <div class="hint">按 Enter 或点"AI 风格化"即可让 AI 把你的文字画成 9-1 蓝色漫画气泡风格</div>
        <div id="aiStatus"></div>
      </div>
    </section>
    <section class="panel">
      <h3>🧡 安洁莉娜(点击添加)</h3>
      <div id="angelinaGrid" class="grid"></div>
    </section>
    <section class="panel">
      <h3>🎨 UI 素材(贴纸)</h3>
      <div id="uiGrid" class="grid" style="grid-template-columns: repeat(4,1fr);"></div>
    </section>
    <section class="panel">
      <h3>📑 图层</h3>
      <ul id="layerList"></ul>
      <div class="row">
        <button id="btnZUp">⬆ 上移</button>
        <button id="btnZDown">⬇ 下移</button>
        <button id="btnDel" class="danger">🗑 删除</button>
      </div>
    </section>
  </aside>
  <section id="stage">
    <div id="hint">拖动 = 移动 · 选中后滚轮 = 缩放(文字为字号) · 双击 = 删除</div>
    <div id="canvasBox">
      <div id="bg"></div>
      <div id="layers"></div>
      <div id="dropHint">把照片拖进来，或点击上方「<b>📷 上传照片</b>」<br>上传后会自动分析照片，把标题放到最合适的空白处</div>
    </div>
  </section>
</main>
<div id="overlay">
  <div class="box">
    <div class="em">🍊</div>
    <div id="ovText">处理中…</div>
    <div id="bar"><div id="barFill"></div></div>
    <div id="ovNote">大图/多帧动图会稍慢，请稍候</div>
  </div>
</div>

<script src="assets-data.js"></script>
<script src="assets/vendor/gif.js"></script>
<script src="assets/vendor/gifuct.bundle.js"></script>
<script>
"use strict";

/* ================= 状态 ================= */
var ANGELINA_KEYS = ["zuozuo","paizhao","tanxian","haibian","qianshui","kanshu","zhifeiji","gouwu","songhuo","qixing"];
var PRESETS = [
  { name: "素材标题", color: "#FFAB3F", stroke: "#1368C0", sw: 8 },
  { name: "方舟白", color: "#FFFFFF", stroke: "#141427", sw: 7 },
  { name: "柠檬黄", color: "#FFD24A", stroke: "#3E2A00", sw: 7 },
  { name: "青柠",   color: "#B8F26A", stroke: "#1F3A00", sw: 7 },
  { name: "天空蓝", color: "#7FD4FF", stroke: "#00243F", sw: 7 },
  { name: "经典黑", color: "#0E0E18", stroke: "#FFFFFF", sw: 6 },
  { name: "少女粉", color: "#FFB3C7", stroke: "#5A0F23", sw: 7 }
];
var state = { photo: null, layers: [], selectedId: null, dispScale: 1 };
var layerIdSeq = 1;
var imgCache = {};

/* ================= 工具 ================= */
function $(id){ return document.getElementById(id); }
function fmt(n){ return Math.round(n * 100) / 100; }
function download(url, filename){
  var a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ a.remove(); }, 3000);
}
function showOverlay(t){ $("ovText").textContent = t; $("barFill").style.width = "0%"; $("overlay").classList.add("show"); }
function setProgress(p){ $("barFill").style.width = Math.min(100, p) + "%"; }
function hideOverlay(){ $("overlay").classList.remove("show"); }
function toast(msg){ var s = $("status"); s.textContent = msg; setTimeout(function(){ if (s.textContent === msg) s.textContent = ""; }, 4500); }
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

/* ================= 素材加载 ================= */
function preloadAssets(){
  var list = [];
  for (var i = 0; i < ANGELINA_KEYS.length; i++){
    var d = window.ASSET_DATA.angelina[ANGELINA_KEYS[i]];
    if (d){ list.push(d.gif); list.push(d.png); }
  }
  for (var name in window.ASSET_DATA.ui) list.push(window.ASSET_DATA.ui[name]);
  for (var j = 0; j < list.length; j++){
    var im = new Image();
    im.src = list[j];
    imgCache[list[j]] = im;
  }
  // 头部小装饰:用安洁莉娜静态图当 logo
  var logo = window.ASSET_DATA.angelina["zuozuo"];
  if (logo) $("brandLogo").src = logo.png;
}

/* ================= 画布渲染 ================= */
function dispW(){ return state.photo ? state.photo.w * state.dispScale : 0; }
function dispH(){ return state.photo ? state.photo.h * state.dispScale : 0; }

function render(){
  var box = $("canvasBox");
  if (!state.photo){
    box.style.width = "640px"; box.style.height = "480px";
    $("bg").innerHTML = ""; $("layers").innerHTML = "";
    $("dropHint").style.display = "flex";
    return;
  }
  $("dropHint").style.display = "none";
  var w = dispW(), h = dispH();
  box.style.width = w + "px"; box.style.height = h + "px";
  $("bg").innerHTML = '<img src="' + state.photo.dataURL + '" alt="">';
  var lc = $("layers");
  lc.innerHTML = "";
  for (var i = state.layers.length - 1; i >= 0; i--){
    var L = state.layers[i];
    var el = document.createElement("div");
    el.className = "ly" + (L.id === state.selectedId ? " sel" : "");
    el.setAttribute("data-lid", L.id);
    el.style.left = (L.x * w) + "px";
    el.style.top  = (L.y * h) + "px";
    el.style.transform = "translate(-50%,-50%) rotate(" + L.rotate + "deg)";
    if (L.type === "text"){
      var fs = L.fontSize * w / 100;
      el.style.fontSize = fs + "px";
      el.style.color = L.color;
      if (L.bubble !== false) {
        el.innerHTML = '<div class="bubble"><span class="txt">' + esc(L.text) + '</span></div>';
      } else {
        el.innerHTML = '<span class="txt">' + esc(L.text) + "</span>";
        el.style.webkitTextStroke = (fs * L.strokeWidth / 100) + "px " + L.strokeColor;
      }
    } else {
      var iw = L.scale * w;
      el.innerHTML = '<img src="' + L.src + '" style="width:' + iw + "px;display:block;" + '" alt="">';
    }
    lc.appendChild(el);
  }
  renderLayersList();
  renderSelectedPanel();
}

/* ================= 照片 ================= */
function setPhoto(dataURL){
  var im = new Image();
  im.onload = function(){
    state.photo = { img: im, dataURL: dataURL, w: im.naturalWidth, h: im.naturalHeight };
    fitCanvas();
    autoPlace();
    render();
    toast("照片已载入，已自动放置标题（可拖动/滚轮缩放调整）");
  };
  im.src = dataURL;
}
function fitCanvas(){
  var stage = $("stage");
  var availW = Math.max(200, (stage.clientWidth || 0) - 40);
  var availH = Math.max(200, (stage.clientHeight || 0) - 80);
  var s = Math.min(availW / state.photo.w, availH / state.photo.h, 1);
  state.dispScale = Math.max(0.05, s);
}

/* ================= 自动找空白位置 ================= */
function findBlankSpot(img, W, H){
  var S = 96;
  var c = document.createElement("canvas");
  c.width = S; c.height = S;
  var ctx = c.getContext("2d");
  ctx.drawImage(img, 0, 0, S, S);
  var data;
  try { data = ctx.getImageData(0, 0, S, S).data; }
  catch(e){ return { x: 0.5, y: 0.16 }; }
  var G = 8, bs = S / G;
  var cells = [];
  for (var gy = 0; gy < G; gy++){
    for (var gx = 0; gx < G; gx++){
      var sum = 0, sum2 = 0, n = 0;
      var x0 = Math.floor(gx * bs), x1 = Math.floor((gx + 1) * bs);
      var y0 = Math.floor(gy * bs), y1 = Math.floor((gy + 1) * bs);
      for (var y = y0; y < y1; y++){
        for (var x = x0; x < x1; x++){
          var i = (y * S + x) * 4;
          var v = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
          sum += v; sum2 += v * v; n++;
        }
      }
      var mean = sum / n;
      var std = Math.sqrt(Math.max(0, sum2 / n - mean * mean));
      cells.push({ gx: gx, gy: gy, std: std });
    }
  }
  var cands = cells.filter(function(c){ return c.gy < 4; }).sort(function(a, b){ return a.std - b.std; });
  var pick = cands[0] || cells.slice().sort(function(a, b){ return a.std - b.std; })[0];
  var cx = Math.max(0.18, Math.min(0.82, (pick.gx + 0.5) / G));
  var cy = Math.max(0.1, Math.min(0.6, (pick.gy + 0.5) / G));
  return { x: cx, y: cy };
}
function autoPlace(){
  if (!state.photo) return;
  var text = $("textInput").value.trim() || "直到大地变成一颗酸橙";
  var pos = findBlankSpot(state.photo.img, state.photo.w, state.photo.h);

    state.layers.push(tl);

  }
  tl.x = pos.x; tl.y = pos.y;
  state.selectedId = tl.id;
}

function zMove(dir){
  var idx = -1;
  for (var i = 0; i < state.layers.length; i++) if (state.layers[i].id === state.selectedId){ idx = i; break; }

  var j = idx + dir;
  if (j < 0 || j >= state.layers.length) return;
  var tmp = state.layers[idx]; state.layers[idx] = state.layers[j]; state.layers[j] = tmp;
  render();
}

/* ================= 交互 ================= */
function bindInteractions(){
  var layersEl = $("layers");
  var drag = null;
  layersEl.addEventListener("pointerdown", function(ev){
    var el = ev.target.closest(".ly");
    if (!el) return;
    var id = parseInt(el.getAttribute("data-lid"), 10);
    var L = null;
    for (var i = 0; i < state.layers.length; i++) if (state.layers[i].id === id){ L = state.layers[i]; break; }
    if (!L) return;
    state.selectedId = id;
    render();
    var w = dispW(), h = dispH();
    drag = { L: L, ox: ev.clientX, oy: ev.clientY, px: L.x * w, py: L.y * h };
    ev.preventDefault();
  });
  layersEl.addEventListener("pointermove", function(ev){
    if (!drag) return;
    var w = dispW(), h = dispH();
    drag.L.x = Math.max(0, Math.min(1, (drag.px + (ev.clientX - drag.ox)) / w));
    drag.L.y = Math.max(0, Math.min(1, (drag.py + (ev.clientY - drag.oy)) / h));
    var el = layersEl.querySelector('[data-lid="' + drag.L.id + '"]');
    if (el){
      el.style.left = (drag.L.x * w) + "px";
      el.style.top  = (drag.L.y * h) + "px";
    }
  });
  function endDrag(){ drag = null; }
  layersEl.addEventListener("pointerup", endDrag);
  layersEl.addEventListener("pointercancel", endDrag);
  window.addEventListener("pointerup", endDrag);

  $("canvasBox").addEventListener("wheel", function(ev){
    var L = selectedLayer();
    if (!L) return;
    ev.preventDefault();
    var dir = ev.deltaY < 0 ? 1.1 : 1 / 1.1;
    if (L.type === "text"){
      L.fontSize = Math.max(2, Math.min(40, L.fontSize * dir));
      $("fontSize").value = L.fontSize;
      $("vFontSize").textContent = fmt(L.fontSize);
    } else {
      L.scale = Math.max(0.02, Math.min(2.5, L.scale * dir));
    }
    render();
  }, { passive: false });

  layersEl.addEventListener("dblclick", function(ev){
    var el = ev.target.closest(".ly");
    if (!el) return;
    var id = parseInt(el.getAttribute("data-lid"), 10);
    state.layers = state.layers.filter(function(x){ return x.id !== id; });
    state.selectedId = null;
    render();
  });
}

function svgToImage(svgText, W, H){
  return new Promise(function(resolve, reject){
    var blob = new Blob([svgText], {type: "image/svg+xml;charset=utf-8"});
    var url = URL.createObjectURL(blob);
    var img = new Image();
    img.onload = function(){
      URL.revokeObjectURL(url);
      resolve(img);
    };
    img.onerror = function(e){
      URL.revokeObjectURL(url);
      reject(new Error("SVG 解析失败"));
    };
    img.src = url;
  });
}

function extractSvg(text){
  // 从 AI 回复中提取 SVG 代码
  var m = text.match(/<svg[\s\S]*?<\/svg>/i);
  if (m) return m[0];
  // 尝试提取 markdown 代码块中的 SVG
  m = text.match(/```(?:svg|xml|html)?\s*\n?([\s\S]*?)```/i);
  if (m && m[1].indexOf("<svg") >= 0) return extractSvg(m[1]);
  return null;
}

function aiGenerate(text){
  if (aiLoading) return;
  var apiKey = $("aiApiKey").value.trim();
  if (!apiKey) {
    $("aiSettings").classList.add("show");
    $("aiApiKey").focus();
    toast("请先设置 Anthropic API Key");
    return;
  }
  if (!state.photo){ toast("请先上传照片"); return; }

  aiLoading = true;
  var btn = $("btnAiGen");
  btn.textContent = "⏳ 生成中…";
  btn.classList.add("loading");
  $("aiStatus").textContent = "生成中…";
  $("aiStatus").className = "";

  var systemPrompt = "你是一个 SVG 插画师。根据用户输入的文字，生成一个日本漫画风格的对话气泡 SVG。\n"
    + "严格要求:\n"
    + "- 蓝色(#1368C0)实线边框，白色(#ffffff)填充\n"
    + "- 圆角矩形，底部中央有三角形尾巴(像漫画对话框)\n"
    + "- 文字用粗体深色(#0B1F33)，居中\n"
    + "- 气泡有轻微阴影，看起来有立体感\n"
    + "- 只返回 SVG 代码，不要任何解释\n"
    + "- SVG 要干净简洁，不要多余元素\n"
    + "- viewBox 根据文字长度自适应\n"
    + "- 字体用 sans-serif, font-weight: 900";

  var userPrompt = "请为这段文字生成漫画对话气泡 SVG:\n" + text;

  var baseUrl = $("aiProxy").value.trim() || "https://api.anthropic.com";
  var endpoint = baseUrl.replace(/\/+$/, "") + "/v1/messages";

  fetch(endpoint, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify({
      model: "claude-sonnet-5",
      max_tokens: 4096,
      system: systemPrompt,
      messages: [{ role: "user", content: userPrompt }]
    })
  }).then(function(r){
    if (!r.ok) return r.text().then(function(t){ throw new Error(r.status + ": " + t.slice(0,300)); });
    return r.json();
  }).then(function(data){
    var reply = "";
    if (data.content && data.content.length){
      for (var i = 0; i < data.content.length; i++){
        if (data.content[i].type === "text") reply += data.content[i].text;
      }
    }
    var svg = extractSvg(reply);
    if (!svg) throw new Error("AI 未返回有效 SVG");

    // 获取 SVG 原始尺寸
    var vbMatch = svg.match(/viewBox=["']([^"']+)["']/);
    var vb = vbMatch ? vbMatch[1].split(/\s+/) : null;

    return svgToImage(svg).then(function(img){
      var L = {
        id: layerIdSeq++, type: "img", name: "AI·" + text.slice(0, 12),
        src: svgToDataUrl(svg), kind: "ai-svg",
        x: 0.5, y: 0.3, scale: 0.4, rotate: 0
      };
      // 缓存图片以便 canvas 导出
      imgCache[L.src] = img;
      state.layers.push(L);
      state.selectedId = L.id;
      render();
      toast("AI 气泡已添加");
      $("aiStatus").textContent = "✓ 完成";
      $("aiStatus").className = "ok";
    });
  }).catch(function(err){
    var msg = err.message || String(err);
    $("aiStatus").textContent = "✗ " + msg;
    $("aiStatus").className = "err";
    if (msg.indexOf("Failed to fetch") >= 0 || msg.indexOf("NetworkError") >= 0){
      $("aiStatus").textContent = "✗ 网络不通(CORS)，请设置代理地址";
      toast("CORS 错误：浏览器不允许直连 API，请点击「设置 API」填写代理地址");
    } else {
      toast("AI 生成失败: " + msg);
    }
    console.error("AI gen error:", err);
  }).finally(function(){
    aiLoading = false;
    var btn = $("btnAiGen");
    btn.textContent = "🤖 AI 风格化";
    btn.classList.remove("loading");
  });
}

function svgToDataUrl(svg){
  return "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(svg)));
}

/* ================= 导出 PNG ================= */
function exportPNG(){
  var p = state.photo;
  if (!p){ toast("请先上传照片"); return; }
  var W = p.w, H = p.h;
  var c = document.createElement("canvas");
  c.width = W; c.height = H;
  var ctx = c.getContext("2d");
  ctx.drawImage(p.img, 0, 0, W, H);
  for (var i = 0; i < state.layers.length; i++) drawLayer(ctx, state.layers[i], W, H);
  download(c.toDataURL("image/png"), "酸橙梗图.png");
  toast("PNG 已导出");
}
function drawLayer(ctx, L, W, H){
  if (L.type === "text"){
    var fs = L.fontSize * W / 100;
    ctx.save();
    ctx.translate(L.x * W, L.y * H);
    ctx.rotate(L.rotate * Math.PI / 180);
    ctx.font = '900 ' + fs + 'px "Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif';
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    if (L.bubble !== false) {
      // 测量文字尺寸
      var metrics = ctx.measureText(L.text);
      var textW = metrics.width;
      var textH = fs * 1.3;
      var padX = fs * 0.55;
      var padY = fs * 0.32;
      var bw = textW + padX * 2;
      var bh = textH + padY * 2;
      var radius = Math.max(4, fs * 0.16);
      var borderW = Math.max(1.5, fs * 0.035);
      var tailH = Math.max(4, fs * 0.14);
      var tailW = Math.max(8, fs * 0.18);

      // 画气泡圆角矩形 + 尾巴
      ctx.beginPath();
      ctx.moveTo(-bw/2 + radius, -bh/2);
      ctx.lineTo(bw/2 - radius, -bh/2);
      ctx.arcTo(bw/2, -bh/2, bw/2, -bh/2 + radius, radius);
      ctx.lineTo(bw/2, bh/2 - radius);
      ctx.arcTo(bw/2, bh/2, bw/2 - radius, bh/2, radius);
      ctx.lineTo(-bw/2 + radius, bh/2);
      ctx.arcTo(-bw/2, bh/2, -bw/2, bh/2 - radius, radius);
      ctx.lineTo(-bw/2, -bh/2 + radius);
      ctx.arcTo(-bw/2, -bh/2, -bw/2 + radius, -bh/2, radius);
      ctx.closePath();
      ctx.fillStyle = "#fff";
      ctx.fill();
      ctx.strokeStyle = "#1368C0";
      ctx.lineWidth = borderW;
      ctx.lineJoin = "round";
      ctx.stroke();

      // 画尾巴
      ctx.beginPath();
      ctx.moveTo(-tailW/2, bh/2 - borderW/2);
      ctx.lineTo(tailW/2, bh/2 - borderW/2);
      ctx.lineTo(0, bh/2 + tailH);
      ctx.closePath();
      ctx.fillStyle = "#fff";
      ctx.fill();
      ctx.strokeStyle = "#1368C0";
      ctx.lineWidth = borderW;
      ctx.lineJoin = "round";
      ctx.stroke();

      // 遮盖气泡底部与尾巴之间的边界线
      ctx.fillStyle = "#fff";
      ctx.fillRect(-tailW/2 - 1, bh/2 - borderW * 2, tailW + 2, borderW * 2.5);
    }

    ctx.lineJoin = "round";
    if (L.bubble === false) {
      ctx.lineWidth = fs * L.strokeWidth / 100;
      ctx.strokeStyle = L.strokeColor;
      ctx.strokeText(L.text, 0, 0);
    }
    ctx.fillStyle = L.color;
    ctx.fillText(L.text, 0, 0);
    ctx.restore();
    return;
  }
  var img = imgCache[L.src];
  if (!img) return;
  var w = L.scale * W;
  var h = w * img.height / img.width;
  ctx.save();
  ctx.translate(L.x * W, L.y * H);
  ctx.rotate(L.rotate * Math.PI / 180);
  ctx.drawImage(img, -w / 2, -h / 2, w, h);
  ctx.restore();
}

/* ================= 导出 GIF(主线程编码,避免 file:// 下 Worker 失败) ================= */
function decodeGif(src){
  return fetch(src).then(function(r){ return r.arrayBuffer(); }).then(function(buf){
    var g = Gifuct.parseGIF(buf);
    var frames = Gifuct.decompressFrames(g, true);
    var totalW = (g.lsd && g.lsd.width) ? g.lsd.width : (frames[0] ? frames[0].dims.width : 1);
    var totalH = (g.lsd && g.lsd.height) ? g.lsd.height : (frames[0] ? frames[0].dims.height : 1);
    var totalMs = 0;
    for (var i = 0; i < frames.length; i++) totalMs += Math.max(40, frames[i].delay || 80);
    var acc = document.createElement("canvas");
    acc.width = totalW; acc.height = totalH;
    return {
      frames: frames, totalW: totalW, totalH: totalH, totalMs: totalMs,
      acc: acc, accCtx: acc.getContext("2d")
    };
  });
}
function gifFrameAt(dec, t){
  var fs = dec.frames;
  var acc = 0;
  for (var i = 0; i < fs.length; i++){
    var d = Math.max(40, fs[i].delay || 80);
    if (t < acc + d) return fs[i];
    acc += d;
  }
  return fs[fs.length - 1];
}
function drawGifLayer(ctx, L, dec, frame, W, H){
  var octx = dec.accCtx;
  if (frame.disposalType === 2) octx.clearRect(0, 0, dec.totalW, dec.totalH);
  var imd = octx.createImageData(frame.dims.width, frame.dims.height);
  if (frame.patch && frame.patch.length){
    var need = frame.dims.width * frame.dims.height * 4;
    var src = frame.patch.length === need ? frame.patch : frame.patch.subarray(0, Math.min(need, frame.patch.length));
    imd.data.set(src);
  }
  octx.putImageData(imd, frame.dims.left, frame.dims.top);
  var w = L.scale * W;
  var h = w * dec.totalH / dec.totalW;
  ctx.save();
  ctx.translate(L.x * W, L.y * H);
  ctx.rotate(L.rotate * Math.PI / 180);
  ctx.drawImage(dec.acc, -w / 2, -h / 2, w, h);
  ctx.restore();
}
function exportGIF(){
  var p = state.photo;
  if (!p){ toast("请先上传照片"); return; }
  var gifLayers = state.layers.filter(function(L){ return L.type === "img" && L.kind === "gif"; });
  if (gifLayers.length === 0){ toast("请先添加一个安洁莉娜动图(GIF)"); return; }
  showOverlay("正在解析动图帧…");
  var finished = false;
  var decs = [];
  var seq = Promise.resolve();
  for (var i = 0; i < gifLayers.length; i++){
    (function(L){
      seq = seq.then(function(){
        setProgress(8);
        return decodeGif(L.src).then(function(dec){ decs.push({ L: L, dec: dec }); });
      });
    })(gifLayers[i]);
  }
  seq.then(function(){
    var main = decs[0];
    for (var i = 1; i < decs.length; i++) if (decs[i].dec.frames.length > main.dec.frames.length) main = decs[i];
    var N = main.dec.frames.length;
    var delays = main.dec.frames.map(function(f){ return Math.max(40, f.delay || 80); });
    var W = p.w, H = p.h;
    var maxDim = 2200;
    var sc = Math.min(1, maxDim / W, maxDim / H);
    var EW = Math.max(64, Math.round(W * sc));
    var EH = Math.max(64, Math.round(H * sc));
    var c = document.createElement("canvas");
    c.width = EW; c.height = EH;
    var ctx = c.getContext("2d");
    showOverlay("正在合成动图(共 " + N + " 帧)…");
    // 用 data: URL 形式的 worker(已内嵌在 assets-data.js):不依赖 file:// 权限与网络,最可靠
    var gif = new GIF({ workers: 2, quality: 10, width: EW, height: EH, workerScript: window.ASSET_DATA.worker });
    gif.on("progress", function(pct){ setProgress(8 + pct * 88); });
    gif.on("error", function(e){
      finished = true;
      hideOverlay();
      toast("GIF 编码失败: " + (e && e.message ? e.message : e));
      console.error(e);
    });
    var t = 0;
    for (var i = 0; i < N; i++){
      t += i === 0 ? 0 : delays[i - 1];
      ctx.drawImage(p.img, 0, 0, EW, EH);
      for (var j = 0; j < state.layers.length; j++){
        var L = state.layers[j];
        if (L.type === "text"){ drawLayer(ctx, L, EW, EH); }
        else if (L.kind === "gif"){
          var d = null;
          for (var k = 0; k < decs.length; k++) if (decs[k].L.id === L.id){ d = decs[k]; break; }
          if (d){ var fr = gifFrameAt(d.dec, t % d.dec.totalMs); drawGifLayer(ctx, L, d.dec, fr, EW, EH); }
        } else {
          drawLayer(ctx, L, EW, EH);
        }
      }
      gif.addFrame(c, { delay: delays[i], copy: true });
    }
    setProgress(96);
    gif.on("finished", function(blob){
      finished = true;
      download(URL.createObjectURL(blob), "酸橙梗图.gif");
      hideOverlay();
      toast("GIF 已导出");
    });
    gif.render();
    // 超时保护:60 秒未完成则提示
    setTimeout(function(){
      if (!finished){
        hideOverlay();
        toast("导出超时(超过 45 秒)，请尝试更小的照片，或确认使用 Chrome/Edge 浏览器");
      }
    }, 45000);
  }).catch(function(err){
    hideOverlay();
    toast("导出失败: " + err.message);
    console.error(err);
  });
}

window.addEventListener("DOMContentLoaded", function(){
  if (!window.ASSET_DATA || !window.ASSET_DATA.angelina){
    document.body.innerHTML = "<p style='padding:40px;color:#c0392b'>缺少 assets-data.js（请先运行 build.ps1 生成）。</p>";
    return;
  }
  preloadAssets();
  loadAiConfig();
  buildAssetPanels();
  bindControls();
  bindInteractions();
  render();
});
</script>
